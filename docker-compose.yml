services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel
      POSTGRES_DB: padel
    ports:
      - '5432:5432'
    volumes:
      - padel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U padel']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  padel_pg:
